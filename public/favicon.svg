  <path d="M102 68C106 68 108 74 104 78C102 80 99 80 98 76" stroke="#ea580c" stroke-width="3" stroke-linecap="round" />

  <!-- Heirloom Heart Rising from the Pot (The Soul/Heart of Tradition) -->
  <path d="M64 56C64 56 46 44 46 33C46 25.5 52 20 59 20C63 20 66.5 22 68 25C69.5 22 73 20 77 20C84 20 90 25.5 90 33C90 44 72 56 64 56Z" fill="url(#heartGrad)" />

